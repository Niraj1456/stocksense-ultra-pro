services:
  - type: web
    name: stocksense-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ENABLE_SMARTAPI
        value: "true"
      # Core Market Data: Angel One SmartAPI
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_ID
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
      # Alternative Data APIs
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      # AI Orchestrator
      - key: GEMINI_API_KEY
        sync: false
