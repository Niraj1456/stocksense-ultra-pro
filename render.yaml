services:
  - type: web
    name: stocksense-backend-v2
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ENABLE_SMARTAPI
        value: "true"
      # Database
      - key: DATABASE_URL
        fromDatabase:
          name: stocksense-db-v2
          property: connectionString
      # CORS Origins (set after Vercel deploy)
      - key: ALLOWED_ORIGINS
        sync: false
      # Security
      - key: TRUTH_PROTOCOL_SECRET
        generateValue: true
      # Core Market Data: Angel One SmartAPI
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_ID
        sync: false
      - key: ANGEL_PIN
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
      # Alternative Data APIs
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: FMP_API_KEY
        sync: false
      # AI Orchestrator
      - key: GEMINI_API_KEY
        sync: false
      # Zerodha Kite Connect
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
databases:
  - name: stocksense-db-v2
    plan: free
    databaseName: stocksense_v2
    user: stocksense_user
